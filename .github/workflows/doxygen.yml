name: Deploy Doxygen Documentation

on:
  push:
    branches: [ main, master ]   # адаптируйте под свою основную ветку

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate Documentation
        run: doxygen Doxyfile   # если Doxyfile в корне, иначе укажите путь

      - name: Create .nojekyll
        run: touch docs/html/.nojekyll   # замените docs/html на ваш OUTPUT_DIRECTORY

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/html   # та же папка, что в OUTPUT_DIRECTORY